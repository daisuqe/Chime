<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chime</title>
<!-- ファビコン（ブラウザのタブ）と、iPhone のホーム画面アイコン -->
<link rel="icon" type="image/png" sizes="32x32" href="image/icon32.png">
<link rel="icon" type="image/png" sizes="64x64" href="image/icon64.png">
<link rel="apple-touch-icon" href="image/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Chime">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* 外の景色以外は白と黒だけ */
  :root { --fg:#fff; --dim:#fff; --warn:#fff; --bad:#fff; --good:#fff; --line:#fff; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#000; color:var(--fg); font-family:'DotGothic16','MS Gothic',monospace; }
  /* スマホで長押し・連打しても文字の範囲選択や拡大鏡・メニューが出ないように */
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  #app { max-width:1140px; margin:0 auto; padding:12px 16px; }
  #top { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  /* 最大 832x611（従来の1.3倍）。ブラウザの幅・高さが足りなければ縦横比を保って縮小 */
  #viewWrap { position:relative; flex:1 1 560px; max-width:min(832px, calc((100vh - 26px) * 832 / 611)); border:1px solid var(--line); }
  #view { display:block; width:100%; height:auto; }
  /* 画面内オーバーレイ：ログ（下）、戦闘コマンド（ログの上） */
  #hud { position:absolute; left:0; right:0; bottom:0; padding:6px 8px; pointer-events:none; }
  #cmd { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; pointer-events:auto; }
  #cmd:empty { display:none; }
  #cmd .who { margin-right:6px; color:var(--warn); background:#000; padding:2px 6px; }
  /* 一時メッセージ：枠なし。各行に黒い帯を敷き、時間が経つと消える */
  #log { display:flex; flex-direction:column; align-items:flex-start; gap:2px; font-size:14px; line-height:1.5; }
  #log div { background:#000; padding:0 6px; transition:opacity .4s; }
  #log div.fade { opacity:0; }
  #log .warn { color:var(--warn); } #log .bad { color:var(--bad); } #log .good { color:var(--good); } #log .sys { color:var(--dim); }
  #dialog { position:absolute; left:4%; right:4%; bottom:4%; background:#000; border:2px solid var(--fg);
            padding:10px 14px; font-size:16px; line-height:1.6; display:none; cursor:pointer; z-index:2; }
  #dialog .next { float:right; color:var(--dim); font-size:13px; }
  #dialog .portrait { float:left; height:120px; margin:-4px 14px -4px -4px; image-rendering:pixelated; }
  #dialog .text { min-height:3.2em; }
  #dialog::after { content:''; display:block; clear:both; }
  #side { flex:0 0 240px; display:flex; flex-direction:column; gap:8px; }
  /* 現在地：プレイ画面の右上の内側 */
  #loc { position:absolute; top:8px; right:10px; font-size:15px; background:#000; padding:2px 6px; pointer-events:none; z-index:1; }
  #map { border:1px solid var(--line); width:240px; height:150px; }
  /* ステータスの下：枠なしの一行 */
  #menuHint { font-size:14px; }
  /* メニュー（M）：プレイ画面の上に重ねる */
  /* プレイ画面の中に収め、中身だけをスクロールする */
  #menu { position:absolute; left:6%; right:6%; top:5%; bottom:5%; background:#000; border:2px solid var(--fg); padding:12px 16px;
          font-size:14px; line-height:1.7; display:none; flex-direction:column; z-index:3; }
  #menu .tabs { display:flex; gap:6px; margin-bottom:8px; }
  #menu .tabs button { flex:1; }
  #menu .tabs button.on { background:#fff; color:#000; }
  #menuBody { flex:1; min-height:0; overflow-y:auto; }
  #menuBody h4 { margin:8px 0 2px; font-size:14px; font-weight:normal; text-decoration:underline; }
  #menu .restart { margin-top:10px; }
  #menu .close { margin-top:8px; cursor:pointer; font-size:12px; }
  button { font-family:inherit; font-size:14px; background:#000; color:var(--fg); border:1px solid var(--fg); padding:4px 10px; cursor:pointer; }
  button:hover { background:#fff; color:#000; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { border:1px solid var(--line); padding:3px 5px; text-align:left; }
  th { color:var(--dim); font-weight:normal; }
  td.num { text-align:right; }
  tr.dead td { color:var(--bad); }
  .shake { animation:shake .25s; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-6px,3px)} 50%{transform:translate(5px,-3px)} 75%{transform:translate(-3px,2px)} }
  /* スマホ用の操作ボタン（ふだんは隠す） */
  /* ボタンは横長（高さ＝幅の 2/3） */
  #pad { display:none; --b:min(29vw, 20vh); grid-template-columns:repeat(3, var(--b)); gap:8px; justify-content:center; margin:10px 0 4px; }
  #pad button { width:var(--b); height:calc(var(--b) * 2 / 3); padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
                font-size:calc(var(--b) * 0.26); line-height:1; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #pad button span { font-size:11px; }
  #pad button:hover { background:#000; color:var(--fg); }
  #pad button.on { background:#fff; color:#000; }
  #pad button:disabled { border-color:#333; }
  /* スマホの縦画面：プレイ画面を全幅、その下にステータスとミニマップ、いちばん下に大きな操作ボタン */
  @media (max-width:700px) and (orientation:portrait), (pointer:coarse) and (orientation:portrait) {
    #app { padding:6px; }
    #top { flex-direction:column; gap:6px; }
    #viewWrap { flex:none; width:100%; max-width:none; }
    #side { flex:none; width:100%; flex-direction:row; align-items:flex-start; gap:6px; }
    #party { flex:1 1 auto; width:auto; font-size:12px; }
    #map { flex:0 0 34%; width:34%; height:auto; }
    #menuHint { display:none; }
    #pad { display:grid; }
    #loc { font-size:12px; top:4px; right:4px; }
    #log { font-size:12px; }
    #cmd button { display:none; } /* 戦闘の行動は下の大きなボタンで選ぶ */
    #dialog { font-size:14px; padding:8px 10px; }
    #menu { font-size:12px; line-height:1.5; top:2%; bottom:2%; left:2%; right:2%; padding:6px 8px; }
    #menu .tabs button { padding:2px 4px; }
    #menuBody h4 { margin:4px 0 0; font-size:12px; }
    #menu .close { margin-top:4px; font-size:10px; }
  }
  /* スマホの横画面：PC と同じくプレイ画面の右にステータスとミニマップ、下に操作ボタンを横1列
     並び：左へ・左を向く・直進・右を向く・右へ・話す・手当・メニュー（後退は使わない）
     戦闘で行動を選ぶ間は、行動 1〜6 と「戻る」が並ぶ */
  @media (pointer:coarse) and (orientation:landscape) {
    #app { display:grid; grid-template-columns:auto 220px; grid-template-areas:'view side' 'pad pad';
           gap:6px; padding:6px; max-width:none; justify-content:center; align-items:start; }
    #top { display:contents; }
    #viewWrap { grid-area:view; flex:none; width:calc((100vh - 86px) * 832 / 611); max-width:calc(100vw - 244px); }
    #side { grid-area:side; flex:none; width:220px; gap:6px; }
    #map { width:220px; height:auto; }
    #menuHint { display:none; }
    #pad { grid-area:pad; display:flex; gap:6px; margin:0; }
    #pad button { flex:1; width:auto; height:60px; font-size:22px; }
    #pad:not(.battle) button[data-k="Numpad2"] { display:none; }
    #pad:not(.battle) button[data-k="Numpad1"] { order:1; }
    #pad:not(.battle) button[data-k="Numpad4"] { order:2; }
    #pad:not(.battle) button[data-k="Numpad5"] { order:3; }
    #pad:not(.battle) button[data-k="Numpad6"] { order:4; }
    #pad:not(.battle) button[data-k="Numpad3"] { order:5; }
    #pad:not(.battle) button[data-k=" "] { order:6; }
    #pad:not(.battle) button[data-k="h"] { order:7; }
    #pad:not(.battle) button[data-k="m"] { order:8; }
    #pad.battle button:disabled { display:none; }
    #loc { font-size:12px; top:4px; right:4px; }
    #log { font-size:12px; }
    #cmd button { display:none; }
    #dialog { font-size:14px; padding:6px 10px; }
    #menu { font-size:12px; line-height:1.5; top:2%; bottom:2%; left:2%; right:2%; padding:6px 8px; }
    #menu .tabs button { padding:2px 4px; }
    #menuBody h4 { margin:4px 0 0; font-size:12px; }
    #menu .close { margin-top:4px; font-size:10px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="viewWrap">
      <canvas id="view" width="832" height="611"></canvas>
      <div id="hud">
        <div id="cmd"></div>
        <div id="log"></div>
      </div>
      <div id="loc"></div>
      <div id="dialog"></div>
      <div id="menu">
        <div class="tabs"><button data-tab="help">ヘルプ</button><button data-tab="prog">進捗</button><button data-tab="log">ログ</button></div>
        <div id="menuBody"></div>
        <div class="close">M・Esc 閉じる ／ ← → 切り替え ／ ↑ ↓ スクロール（ここをタップでも閉じる）</div>
      </div>
      <template id="helpText">
        <div>テンキー 5 前進 / 2 後退 / 4 左を向く / 6 右を向く</div>
        <div>テンキー 1 左へ平行移動 / 3 右へ平行移動</div>
        <div>Space・Enter 話す・調べる・階段を使う</div>
        <div>H 回復（手当て・合唱を使える先生がいるとき）</div>
        <div>仲間（職員室の先生・水野）は、はじめは1人まで。サブシナリオを2本・4本解決すると連れて行ける人数が増える（最大4人パーティ）</div>
        <div>いっぱいのときに誘うと、誰と交代するか選べる。外れた仲間は元の場所で待っている</div>
        <div>戦闘中：数字キーで行動を選ぶ / Esc ひとつ戻る</div>
        <div>落とし物は、そのマスに乗ると拾う</div>
        <div>進み具合は自動で保存され、次に開くと続きから始まる</div>
      </template>
    </div>
    <div id="side">
      <table id="party"></table>
      <div id="menuHint">M : Menu</div>
      <canvas id="map" width="240" height="150"></canvas>
    </div>
  </div>
  <!-- スマホ用：テンキーと同じ並び（上段 向き・前進、中段 平行移動・後退、下段 メニュー・調べる・手当て） -->
  <div id="pad">
    <button data-k="Numpad4"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"><path d="M16 21V9H5"/><path d="M9 5L5 9l4 4"/></svg><span>左を向く</span></button>
    <button data-k="Numpad5">↑<span>直進</span></button>
    <button data-k="Numpad6"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 21V9h11"/><path d="M15 5l4 4-4 4"/></svg><span>右を向く</span></button>
    <button data-k="Numpad1">←<span>左へ</span></button>
    <button data-k="Numpad2">↓<span>後退</span></button>
    <button data-k="Numpad3">→<span>右へ</span></button>
    <button data-k="m">M<span>メニュー</span></button>
    <button data-k=" ">●<span>話す</span></button>
    <button data-k="h">H<span>手当</span></button>
  </div>
</div>
<script src="school.js"></script>
<script src="events.js"></script>
<script src="game.js"></script>
</body>
</html>
