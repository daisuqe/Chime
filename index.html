<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chime</title>
<!-- ファビコン（ブラウザのタブ）と、iPhone のホーム画面アイコン -->
<link rel="icon" type="image/png" sizes="32x32" href="image/icon32.png">
<link rel="icon" type="image/png" sizes="64x64" href="image/icon64.png">
<link rel="apple-touch-icon" href="image/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Chime">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* 外の景色以外は白と黒だけ */
  :root { --fg:#fff; --dim:#fff; --warn:#fff; --bad:#fff; --good:#fff; --line:#fff; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html,body { margin:0; background:#000; color:var(--fg); font-family:'DotGothic16','MS Gothic',monospace; }
  /* スマホで長押し・連打しても文字の範囲選択や拡大鏡・メニューが出ないように */
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  *, *::before, *::after { touch-action:manipulation; }
  #app { max-width:1140px; margin:0 auto; padding:12px 16px; }
  #top { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  /* 最大 832x611（従来の1.3倍）。ブラウザの幅・高さが足りなければ縦横比を保って縮小 */
  #viewWrap { position:relative; flex:1 1 560px; max-width:min(832px, calc((100vh - 26px) * 832 / 611)); border:1px solid var(--line); }
  #view { display:block; width:100%; height:auto; }
  /* 画面内オーバーレイ：ログ（下）、戦闘コマンド（ログの上） */
  #hud { position:absolute; left:0; right:0; bottom:0; padding:6px 8px; pointer-events:none; }
  #cmd { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; pointer-events:auto; }
  #cmd:empty { display:none; }
  #cmd .who { margin-right:6px; color:var(--warn); background:#000; padding:2px 6px; }
  /* 一時メッセージ：枠なし。各行に黒い帯を敷き、時間が経つと消える */
  #log { display:flex; flex-direction:column; align-items:flex-start; gap:2px; font-size:14px; line-height:1.5; }
  #log div { background:#000; padding:0 6px; transition:opacity .4s; }
  #log div.fade { opacity:0; }
  #log .warn { color:var(--warn); } #log .bad { color:var(--bad); } #log .good { color:var(--good); } #log .sys { color:var(--dim); }
  #dialog { position:absolute; left:4%; right:4%; bottom:4%; background:#000; border:2px solid var(--fg);
            padding:10px 14px; font-size:16px; line-height:1.6; display:none; cursor:pointer; z-index:2; }
  #dialog .next { float:right; color:var(--dim); font-size:13px; }
  #dialog .itemicon { float:left; height:56px; margin:0 12px 0 0; image-rendering:pixelated; }
  #dialog .portrait { float:left; height:120px; margin:-4px 14px -4px -4px; image-rendering:pixelated; }
  #dialog .text { min-height:3.2em; }
  #dialog::after { content:''; display:block; clear:both; }
  #side { flex:0 0 240px; display:flex; flex-direction:column; gap:8px; }
  /* 現在地：プレイ画面の右上の内側 */
  #loc { position:absolute; top:8px; right:10px; font-size:15px; background:#000; padding:2px 6px; pointer-events:none; z-index:1; }
  /* マップ：外枠（#mapBox）の大きさで決まり、キャンバスはその上に重ねるだけ（キャンバス自身の大きさは配置に使わない） */
  #mapBox { position:relative; flex:none; width:240px; height:150px; }
  #map { position:absolute; left:0; top:0; width:100%; height:100%; display:block; border:1px solid var(--line); cursor:pointer; }
  /* 全画面の地図 */
  #bigmap { display:none; position:fixed; inset:0; z-index:50; background:#000; }
  #bigmapCanvas { position:absolute; inset:0; width:100%; height:100%; }
  #bigmapClose { position:absolute; top:10px; right:10px; width:48px; height:48px; padding:0; background:#000; color:#fff; border:2px solid #fff; cursor:pointer; }
  #bigmapClose svg { display:block; width:100%; height:100%; }
  #bigmapFloors { position:absolute; top:10px; left:10px; right:70px; display:flex; flex-wrap:wrap; gap:6px; }
  #bigmapFloors button { min-width:56px; height:48px; padding:0 8px; background:#000; color:#fff; border:2px solid #fff; font:inherit; font-size:20px; cursor:pointer; }
  #bigmapFloors button.on { background:#fff; color:#000; }
  /* ステータスの下：枠なしの一行 */
  #menuHint { font-size:14px; }
  /* メニュー（M）：プレイ画面の上に重ねる */
  /* プレイ画面の中に収め、中身だけをスクロールする */
  /* メニュー：画面全体に出す（スマホの操作ボタンの上にも重なる） */
  #menu { position:fixed; inset:0; background:#000; border:2px solid var(--fg); padding:12px 16px;
          padding-top:max(12px, env(safe-area-inset-top)); padding-bottom:max(12px, env(safe-area-inset-bottom));
          font-size:14px; line-height:1.7; display:none; flex-direction:column; z-index:40; }
  #menu .tabs { display:flex; gap:6px; margin-bottom:8px; }
  #menu .tabs button { flex:1; }
  #menu .tabs button.on { background:#fff; color:#000; }
  #menuBody { flex:1; min-height:0; overflow-y:auto; }
  #menuBody h4 { margin:8px 0 2px; font-size:14px; font-weight:normal; text-decoration:underline; }
  #menu .restart { margin-top:10px; }
  #menu .close { margin-top:8px; cursor:pointer; font-size:12px; }
  #menu .close.btn { flex:none; border:2px solid var(--fg); text-align:center; padding:10px 0; font-size:20px !important; }
  #menu .tabs button { white-space:nowrap; min-width:0; overflow:hidden; }
  button { font-family:inherit; font-size:14px; background:#000; color:var(--fg); border:1px solid var(--fg); padding:4px 10px; cursor:pointer; }
  button:hover { background:#fff; color:#000; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { border:1px solid var(--line); padding:3px 5px; text-align:left; }
  th { color:var(--dim); font-weight:normal; }
  td.num { text-align:right; }
  tr.dead td { color:var(--bad); }
  .shake { animation:shake .25s; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-6px,3px)} 50%{transform:translate(5px,-3px)} 75%{transform:translate(-3px,2px)} }
  /* スマホ用の操作ボタン（ふだんは隠す） */
  #pad { display:none; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:6px; margin:8px 0 4px; }
  #pad button { width:auto; height:min(19vw, 13vh); padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
                font-size:min(7vw, 30px); line-height:1; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #pad button span { font-size:11px; }
  #pad:not(.battle) button.txt { font-size:min(4vw, 20px); white-space:nowrap; } /* 文字だけのボタン（メニュー・話す） */
  #pad button:hover { background:#000; color:var(--fg); }
  #pad button { min-width:0; overflow:hidden; }
  #pad button.on { background:#fff; color:#000; }
  #pad button:disabled { border-color:#333; }
  #pad button[data-k="Numpad1"] { grid-row:2; grid-column:2; }
  #pad button[data-k="Numpad2"] { grid-row:2; grid-column:3; }
  #pad button[data-k="Numpad3"] { grid-row:2; grid-column:4; }
  #pad.battle button.extra { visibility:hidden; }
  /* スマホの縦画面：上からマップ、プレイ画面、ステータス（どれも全幅）、いちばん下に大きな操作ボタン */
  @media (max-width:700px) and (orientation:portrait), (pointer:coarse) and (orientation:portrait) {
    html, body { overflow:hidden; }
    /* 高さは見えている画面の高さに固定（--appH は game.js が実際の高さを入れる。ホーム画面から開いたときも合うように）
       マップが残りの高さを使い、入りきらないときはマップが低くなる。iPhone の下のバーの分はあける */
    #app { padding:6px; padding-top:max(6px, env(safe-area-inset-top)); padding-bottom:max(6px, env(safe-area-inset-bottom));
           height:100vh; height:var(--appH, 100dvh); display:flex; flex-direction:column; }
    /* iPhone の Safari は、中身が一瞬でも横にはみ出すとページの幅そのものを広げてしまう。
       外枠で切り取って、何があっても画面の幅を超えないようにする */
    #app { width:100%; max-width:100vw; overflow:hidden; }
    #top { flex:1 1 auto; min-height:0; flex-direction:column; flex-wrap:nowrap; gap:6px; }
    #viewWrap { flex:none; width:100%; max-width:none; }
    #side { display:contents; } /* 中身（マップ・ステータス）を、プレイ画面と同じ並びに出す */
    #mapBox { order:-1; } /* マップはプレイ画面の上 */
    #party { order:1; } /* ステータスはプレイ画面の下 */
    #party { width:100%; font-size:17px; table-layout:fixed; }
    #party td, #party th { overflow:hidden; white-space:nowrap; }
    #top > *, #side > * { min-width:0; max-width:100%; } /* どの部品も画面の幅を超えない */
    #party th, #party td { padding:2px 4px; }
    #mapBox { flex:1 1 0; min-height:0; width:100%; height:auto; } /* 横は画面の幅、縦は残りの高さ（足りなければ低くなる） */
    #menuHint { display:none; }
    #pad { display:grid; flex:none; margin:6px 0 0; }
    #pad button { height:auto; aspect-ratio:1 / 1; } /* ボタンは正方形 */
    #loc { font-size:18px; top:4px; right:4px; }
    #log { font-size:18px; }
    #cmd button { display:none; } /* 戦闘の行動は下の大きなボタンで選ぶ */
    #dialog { font-size:21px; padding:8px 10px; }
    #dialog .next { font-size:16px; }
    #cmd .who { font-size:21px; }
    #pad button span { font-size:16px; }
    #menu { font-size:18px; line-height:1.5; padding-left:8px; padding-right:8px; }
    #menu .tabs button { padding:2px 4px; font-size:min(4.4vw, 18px); }
    #menuBody h4 { margin:4px 0 0; font-size:18px; }
    #menu .close { margin-top:4px; font-size:15px; }
    #menu button { font-size:18px; }
  }
  /* スマホの横画面：PC と同じくプレイ画面の右にステータスとミニマップ、下に操作ボタンを横1列
     並び：左へ・左を向く・直進・右を向く・右へ・話す・手当・メニュー（後退は使わない）
     戦闘で行動を選ぶ間は、行動 1〜6 と「戻る」が並ぶ */
  @media (pointer:coarse) and (orientation:landscape) {
    #app { overflow:hidden; max-width:100vw; display:grid; grid-template-columns:auto 260px; grid-template-areas:'view side' 'pad pad';
           gap:6px; padding:6px; max-width:none; justify-content:center; align-items:start; }
    #top { display:contents; }
    #viewWrap { grid-area:view; flex:none; width:calc((100vh - 96px) * 832 / 611); max-width:calc(100vw - 284px); }
    #side { grid-area:side; flex:none; width:260px; gap:6px; }
    #mapBox { width:260px; height:162px; }
    #menuHint { display:none; }
    #pad { grid-area:pad; display:grid; gap:6px; margin:0; grid-template-columns:repeat(7, minmax(0, 1fr)); }
    #pad button[data-k] { grid-row:auto; grid-column:auto; }
    #pad button[data-k="Numpad2"] { display:none; }
    #pad.battle { grid-template-columns:repeat(5, minmax(0, 1fr)); }
    #pad.battle button.extra { display:none; }
    #pad button { width:auto; height:52px; font-size:24px; }
    #pad.battle button:disabled { display:none; }
    #loc { font-size:18px; top:4px; right:4px; }
    #log { font-size:18px; }
    #cmd button { display:none; }
    #dialog { font-size:21px; padding:6px 10px; }
    #dialog .next { font-size:16px; }
    #cmd .who { font-size:21px; }
    #party { font-size:17px; }
    #party th, #party td { padding:2px 4px; }
    #pad button span { font-size:16px; }
    #menu { font-size:18px; line-height:1.5; padding-left:8px; padding-right:8px; }
    #menu .tabs button { padding:2px 4px; font-size:min(4.4vw, 18px); }
    #menuBody h4 { margin:4px 0 0; font-size:18px; }
    #menu .close { margin-top:4px; font-size:15px; }
    #menu button { font-size:18px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="viewWrap">
      <canvas id="view" width="832" height="611"></canvas>
      <div id="hud">
        <div id="cmd"></div>
        <div id="log"></div>
      </div>
      <div id="loc"></div>
      <div id="dialog"></div>
      <div id="menu">
        <div class="tabs"><button data-tab="help">ヘルプ</button><button data-tab="prog">進捗</button><button data-tab="log">ログ</button><button data-tab="restart">はじめから</button></div>
        <div id="menuBody"></div>
        <div class="close">M・Esc 閉じる ／ ← → 切り替え ／ ↑ ↓ スクロール（ここをタップでも閉じる）</div>
      </div>
      <template id="helpText">
        <div>テンキー 5 前進 / 2 後退 / 4 左を向く / 6 右を向く</div>
        <div>テンキー 1 左へ平行移動 / 3 右へ平行移動</div>
        <div>Space・Enter 話す・調べる・階段を使う</div>
        <div>H 回復（手当て・歌声を使える仲間がいるとき）。前に何もない所で話すと、仲間と話せる</div>
        <div>仲間（職員室の先生など）は、はじめは1人まで。頼まれごとを解決していくと、連れて行ける人数が増える</div>
        <div>いっぱいのときに誘うと、誰と交代するか選べる。外れた仲間は元の場所で待っている</div>
        <div>戦闘中：数字キーで行動を選ぶ / Esc ひとつ戻る</div>
        <div>落とし物は、そのマスに乗ると拾う</div>
        <div>進み具合は自動で保存され、次に開くと続きから始まる</div>
      </template>
    </div>
    <div id="side">
      <table id="party"></table>
      <div id="menuHint">M : Menu</div>
      <div id="mapBox"><canvas id="map" width="240" height="150"></canvas></div>
    </div>
  </div>
  <!-- スマホ用の操作ボタン
     縦画面：1 行目 メニュー・左を向く・直進・右を向く・話す／2 行目 左移動・後退・右移動（向く・直進の真下）
     横画面：1 行に メニュー・左移動・左を向く・直進・右を向く・右移動・話す（後退は出さない）
     戦闘や選択肢の間は、1 行目の 5 つが左から 1〜5 の選択肢になり、移動のボタンは隠れる -->
  <div id="pad">
    <button data-k="m" class="txt">メニュー</button>
    <button data-k="Numpad1" class="extra">←</button>
    <button data-k="Numpad4"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"><path d="M16 21V9H5"/><path d="M9 5L5 9l4 4"/></svg></button>
    <button data-k="Numpad5">↑</button>
    <button data-k="Numpad6"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 21V9h11"/><path d="M15 5l4 4-4 4"/></svg></button>
    <button data-k="Numpad3" class="extra">→</button>
    <button data-k=" " class="txt">話す</button>
    <button data-k="Numpad2" class="extra">↓</button>
  </div>
</div>
<!-- 全画面の地図（小さな地図を押すと開く） -->
<div id="bigmap">
  <canvas id="bigmapCanvas"></canvas>
  <div id="bigmapFloors"></div>
  <button id="bigmapClose" aria-label="閉じる"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square"><path d="M14 14L34 34M34 14L14 34"/></svg></button>
</div>
<script src="school.js"></script>
<script src="events.js"></script>
<script src="game.js"></script>
</body>
</html>
